services:
  - type: web
    name: careerpilot-backend
    runtime: docker
    region: oregon
    plan: free
    rootDir: server
    dockerfilePath: Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: careerpilot-db
          property: connectionString
      - key: PORT
        value: "10000"
      - key: JWT_SECRET
        generateValue: true
      - key: AI_ENABLED
        value: "true"
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: "*"

databases:
  - name: careerpilot-db
    databaseName: careerpilot_db
    plan: free
    region: oregon
