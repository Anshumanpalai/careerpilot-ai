spring:
  datasource:
    url: jdbc:h2:mem:careerpilot_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

app:
  storage:
    resumes-dir: "./target/test-storage/resumes"
  jwt:
    secret: "careerpilot-test-jwt-secret-key-must-be-at-least-256-bits-long-for-hmac-sha256"
    expiration-ms: 86400000
    issuer: careerpilot-ai
  cors:
    allowed-origins: "http://localhost:5173,http://localhost:5174,http://localhost:3000"
  ai:
    enabled: false
    provider: gemini
    api-key: ""
    gemini-api-key: ""
